<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声波透视眼 - 声学探测器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #000000;
            padding: 10px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .header p {
            font-size: 14px;
            color: #666666;
        }

        .tab-container {
            display: flex;
            border: 2px solid #000000;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: #ffffff;
            border-right: 1px solid #000000;
            font-size: 14px;
            font-weight: 500;
        }

        .tab:last-child {
            border-right: none;
        }

        .tab.active {
            background: #000000;
            color: #ffffff;
        }

        .tab:hover:not(.active) {
            background: #f0f0f0;
        }

        .tab-content {
            display: none;
            border: 2px solid #000000;
            padding: 25px;
        }

        .tab-content.active {
            display: block;
        }

        .control-group {
            margin-bottom: 20px;
            border-bottom: 1px solid #cccccc;
            padding-bottom: 15px;
        }

        .control-group:last-child {
            border-bottom: none;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .slider-container {
            position: relative;
            margin: 15px 0;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 0;
            background: #cccccc;
            outline: none;
            -webkit-appearance: none;
            border: 1px solid #000000;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 0;
            background: #000000;
            cursor: pointer;
            border: 2px solid #ffffff;
        }

        .slider-value {
            text-align: center;
            margin-top: 5px;
            font-weight: bold;
            color: #000000;
        }

        .button {
            width: 100%;
            padding: 15px;
            border: 2px solid #000000;
            background: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            color: #000000;
        }

        .button-primary {
            background: #000000;
            color: #ffffff;
        }

        .button-primary:hover {
            background: #333333;
        }

        .button-secondary {
            background: #ffffff;
            color: #000000;
        }

        .button-secondary:hover {
            background: #f0f0f0;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #000000;
            font-weight: 500;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border: 2px solid #000000;
            margin-right: 10px;
        }

        .status-ready { background-color: #ffffff; }
        .status-detecting { background-color: #cccccc; }
        .status-error { background-color: #000000; }

        .detection-display {
            background: #f5f5f5;
            border: 2px solid #000000;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .distance-display {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000000;
        }

        .waveform-container {
            height: 100px;
            background: #f5f5f5;
            border: 2px solid #000000;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
        }

        .waveform {
            width: 100%;
            height: 100%;
        }

        .detection-log {
            max-height: 200px;
            overflow-y: auto;
            background: #f5f5f5;
            border: 2px solid #000000;
            padding: 15px;
            margin-top: 15px;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #cccccc;
            font-size: 14px;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .radar-display {
            width: 200px;
            height: 200px;
            border: 3px solid #000000;
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            background: #ffffff;
        }

        .radar-circles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
        }

        .radar-circle {
            position: absolute;
            border: 1px solid #cccccc;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .radar-circle:nth-child(1) { width: 33%; height: 33%; }
        .radar-circle:nth-child(2) { width: 66%; height: 66%; }
        .radar-circle:nth-child(3) { width: 100%; height: 100%; }

        .radar-sweep {
            width: 2px;
            height: 95px;
            background: #000000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: bottom center;
            animation: radar-sweep 3s linear infinite;
        }

        .radar-dot {
            width: 8px;
            height: 8px;
            background: #000000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: radar-ping 2s ease-out infinite;
        }

        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes radar-ping {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .setting-item {
            background: #f5f5f5;
            border: 2px solid #000000;
            padding: 15px;
            text-align: center;
        }

        .setting-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .setting-label {
            font-size: 12px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>声波透视眼</h1>
            <p>基于回声定位原理的声学探测器</p>
        </div>

        <div class="tab-container">
            <div class="tab active" onclick="switchTab('generator')">信号发生器</div>
            <div class="tab" onclick="switchTab('detector')">探测器</div>
            <div class="tab" onclick="switchTab('analyzer')">分析仪</div>
        </div>

        <!-- 信号发生器 -->
        <div id="generator" class="tab-content active">
            <div class="control-group">
                <label>频率控制</label>
                <div class="slider-container">
                    <input type="range" id="frequencySlider" class="slider" min="100" max="10000" value="5000" step="100">
                    <div class="slider-value" id="frequencyValue">5000 Hz</div>
                </div>
            </div>

            <div class="control-group">
                <label>音量控制</label>
                <div class="slider-container">
                    <input type="range" id="volumeSlider" class="slider" min="0" max="100" value="50">
                    <div class="slider-value" id="volumeValue">50%</div>
                </div>
            </div>

            <button id="playButton" class="button button-primary">播放测试音</button>
            <button id="stopButton" class="button button-secondary">停止</button>

            <div class="status-indicator">
                <div class="status-dot status-ready"></div>
                <span id="generatorStatus">就绪</span>
            </div>

            <div class="waveform-container">
                <canvas id="waveformCanvas" class="waveform"></canvas>
            </div>
        </div>

        <!-- 探测器 -->
        <div id="detector" class="tab-content">
            <div class="control-group">
                <label>探测模式</label>
                <div class="settings-grid">
                    <div class="setting-item">
                        <div class="setting-value" id="detectionRange">3.0m</div>
                        <div class="setting-label">探测范围</div>
                    </div>
                    <div class="setting-item">
                        <div class="setting-value" id="sensitivity">高</div>
                        <div class="setting-label">灵敏度</div>
                    </div>
                </div>
            </div>

            <button id="startDetection" class="button button-primary">开始探测</button>
            <button id="stopDetection" class="button button-secondary">停止探测</button>

            <div class="status-indicator">
                <div class="status-dot status-ready" id="detectorStatusDot"></div>
                <span id="detectorStatus">准备就绪</span>
            </div>

            <div class="detection-display">
                <div class="distance-display" id="distanceDisplay">-- cm</div>
                <div>检测到的距离</div>
            </div>

            <div class="radar-display">
                <div class="radar-circles">
                    <div class="radar-circle"></div>
                    <div class="radar-circle"></div>
                    <div class="radar-circle"></div>
                </div>
                <div class="radar-sweep"></div>
                <div class="radar-dot" id="radarDot" style="display: none;"></div>
            </div>

            <div class="detection-log" id="detectionLog">
                <div class="log-entry">等待开始探测...</div>
            </div>
        </div>

        <!-- 分析仪 -->
        <div id="analyzer" class="tab-content">
            <div class="control-group">
                <label>音频分析</label>
                <button id="startAnalysis" class="button button-primary">开始分析</button>
                <button id="stopAnalysis" class="button button-secondary">停止分析</button>
            </div>

            <div class="status-indicator">
                <div class="status-dot status-ready" id="analyzerStatusDot"></div>
                <span id="analyzerStatus">准备分析</span>
            </div>

            <div class="settings-grid">
                <div class="setting-item">
                    <div class="setting-value" id="peakFrequency">-- Hz</div>
                    <div class="setting-label">主频率</div>
                </div>
                <div class="setting-item">
                    <div class="setting-value" id="amplitude">-- dB</div>
                    <div class="setting-label">振幅</div>
                </div>
            </div>

            <div class="waveform-container">
                <canvas id="spectrumCanvas" class="waveform"></canvas>
            </div>

            <div class="control-group">
                <label>反射分析</label>
                <div class="settings-grid">
                    <div class="setting-item">
                        <div class="setting-value" id="reflectionStrength">-- %</div>
                        <div class="setting-label">反射强度</div>
                    </div>
                    <div class="setting-item">
                        <div class="setting-value" id="materialType">未知</div>
                        <div class="setting-label">材质推测</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let audioContext;
        let oscillator;
        let gainNode;
        let analyser;
        let mediaStream;
        let isPlaying = false;
        let isDetecting = false;
        let isAnalyzing = false;
        let detectionInterval;
        let analysisInterval;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeAudio();
            setupEventListeners();
            drawWaveform();
        });

        // 初始化音频上下文
        async function initializeAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                console.log('音频系统初始化成功');
            } catch (error) {
                console.error('音频初始化失败:', error);
                updateStatus('generator', '音频初始化失败', 'error');
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 频率滑块
            document.getElementById('frequencySlider').addEventListener('input', function(e) {
                document.getElementById('frequencyValue').textContent = e.target.value + ' Hz';
                if (isPlaying) {
                    oscillator.frequency.setValueAtTime(e.target.value, audioContext.currentTime);
                }
            });

            // 音量滑块
            document.getElementById('volumeSlider').addEventListener('input', function(e) {
                const volume = e.target.value / 100;
                document.getElementById('volumeValue').textContent = e.target.value + '%';
                if (gainNode) {
                    gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                }
            });

            // 播放按钮
            document.getElementById('playButton').addEventListener('click', playTone);
            document.getElementById('stopButton').addEventListener('click', stopTone);

            // 探测按钮
            document.getElementById('startDetection').addEventListener('click', startDetection);
            document.getElementById('stopDetection').addEventListener('click', stopDetection);

            // 分析按钮
            document.getElementById('startAnalysis').addEventListener('click', startAnalysis);
            document.getElementById('stopAnalysis').addEventListener('click', stopAnalysis);
        }

        // 标签页切换
        function switchTab(tabName) {
            // 隐藏所有标签页内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // 显示选中的标签页
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // 播放测试音
        async function playTone() {
            if (isPlaying) return;

            try {
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                const frequency = document.getElementById('frequencySlider').value;
                const volume = document.getElementById('volumeSlider').value / 100;

                oscillator = audioContext.createOscillator();
                gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                gainNode.connect(analyser);

                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);

                oscillator.start();
                isPlaying = true;

                updateStatus('generator', '正在播放 ' + frequency + ' Hz', 'detecting');
                animateWaveform();

            } catch (error) {
                console.error('播放失败:', error);
                updateStatus('generator', '播放失败', 'error');
            }
        }

        // 停止播放
        function stopTone() {
            if (oscillator && isPlaying) {
                oscillator.stop();
                oscillator = null;
                gainNode = null;
                isPlaying = false;
                updateStatus('generator', '已停止', 'ready');
            }
        }

        // 开始探测
        async function startDetection() {
            if (isDetecting) return;

            try {
                // 请求麦克风权限
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioContext.createMediaStreamSource(mediaStream);
                const detectionAnalyser = audioContext.createAnalyser();
                source.connect(detectionAnalyser);

                detectionAnalyser.fftSize = 2048;
                const bufferLength = detectionAnalyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                isDetecting = true;
                updateStatus('detector', '正在探测...', 'detecting');
                
                // 显示雷达点
                document.getElementById('radarDot').style.display = 'block';

                detectionInterval = setInterval(() => {
                    detectionAnalyser.getByteFrequencyData(dataArray);
                    
                    // 模拟距离计算（实际应用中需要更复杂的算法）
                    const avgVolume = dataArray.reduce((sum, value) => sum + value, 0) / bufferLength;
                    const distance = Math.max(10, Math.min(300, 300 - avgVolume * 2));
                    
                    document.getElementById('distanceDisplay').textContent = Math.round(distance) + ' cm';
                    
                    // 添加检测日志
                    addDetectionLog(`距离: ${Math.round(distance)}cm, 信号强度: ${Math.round(avgVolume)}`);
                    
                    // 更新雷达点位置
                    updateRadarDot(distance);
                    
                }, 200);

            } catch (error) {
                console.error('探测启动失败:', error);
                updateStatus('detector', '麦克风访问失败', 'error');
            }
        }

        // 停止探测
        function stopDetection() {
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            isDetecting = false;
            updateStatus('detector', '探测已停止', 'ready');
            document.getElementById('radarDot').style.display = 'none';
            document.getElementById('distanceDisplay').textContent = '-- cm';
        }

        // 开始分析
        async function startAnalysis() {
            if (isAnalyzing) return;

            try {
                if (!mediaStream) {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                }
                
                const source = audioContext.createMediaStreamSource(mediaStream);
                const analysisAnalyser = audioContext.createAnalyser();
                source.connect(analysisAnalyser);

                analysisAnalyser.fftSize = 2048;
                const bufferLength = analysisAnalyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                isAnalyzing = true;
                updateStatus('analyzer', '正在分析...', 'detecting');

                analysisInterval = setInterval(() => {
                    analysisAnalyser.getByteFrequencyData(dataArray);
                    
                    // 找到峰值频率
                    let maxValue = 0;
                    let maxIndex = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        if (dataArray[i] > maxValue) {
                            maxValue = dataArray[i];
                            maxIndex = i;
                        }
                    }
                    
                    const frequency = (maxIndex * audioContext.sampleRate) / (2 * bufferLength);
                    const amplitude = 20 * Math.log10(maxValue / 255);
                    
                    document.getElementById('peakFrequency').textContent = Math.round(frequency) + ' Hz';
                    document.getElementById('amplitude').textContent = Math.round(amplitude) + ' dB';
                    
                    // 模拟反射强度和材质识别
                    const reflectionStrength = Math.min(100, maxValue / 2.55);
                    document.getElementById('reflectionStrength').textContent = Math.round(reflectionStrength) + '%';
                    
                    let materialType = '未知';
                    if (reflectionStrength > 80) materialType = '金属';
                    else if (reflectionStrength > 50) materialType = '木材';
                    else if (reflectionStrength > 20) materialType = '塑料';
                    else materialType = '织物';
                    
                    document.getElementById('materialType').textContent = materialType;
                    
                    // 绘制频谱
                    drawSpectrum(dataArray);
                    
                }, 100);

            } catch (error) {
                console.error('分析启动失败:', error);
                updateStatus('analyzer', '分析启动失败', 'error');
            }
        }

        // 停止分析
        function stopAnalysis() {
            if (analysisInterval) {
                clearInterval(analysisInterval);
                analysisInterval = null;
            }
            
            isAnalyzing = false;
            updateStatus('analyzer', '分析已停止', 'ready');
            
            // 重置显示
            document.getElementById('peakFrequency').textContent = '-- Hz';
            document.getElementById('amplitude').textContent = '-- dB';
            document.getElementById('reflectionStrength').textContent = '-- %';
            document.getElementById('materialType').textContent = '未知';
        }

        // 更新状态
        function updateStatus(module, message, status) {
            const statusElement = document.getElementById(module + 'Status');
            const dotElement = document.getElementById(module + 'StatusDot') || 
                              document.querySelector(`#${module} .status-dot`);
            
            if (statusElement) statusElement.textContent = message;
            if (dotElement) {
                dotElement.className = `status-dot status-${status}`;
            }
        }

        // 绘制波形
        function drawWaveform() {
            const canvas = document.getElementById('waveformCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            const frequency = document.getElementById('frequencySlider').value;
            const amplitude = canvas.height / 4;
            const centerY = canvas.height / 2;
            
            for (let x = 0; x < canvas.width; x++) {
                const y = centerY + amplitude * Math.sin((x / canvas.width) * 2 * Math.PI * (frequency / 1000));
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            
            ctx.stroke();
        }

        // 动画波形
        function animateWaveform() {
            if (!isPlaying) return;
            
            drawWaveform();
            requestAnimationFrame(animateWaveform);
        }

        // 绘制频谱
        function drawSpectrum(dataArray) {
            const canvas = document.getElementById('spectrumCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = canvas.width / dataArray.length;
            let x = 0;
            
            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                
                // 使用黑白渐变
                const intensity = dataArray[i] / 255;
                const gray = Math.round(intensity * 255);
                ctx.fillStyle = `rgb(${gray}, ${gray}, ${gray})`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                
                x += barWidth;
            }
        }

        // 添加检测日志
        function addDetectionLog(message) {
            const logContainer = document.getElementById('detectionLog');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = `[${timestamp}] ${message}`;
            
            logContainer.insertBefore(logEntry, logContainer.firstChild);
            
            // 限制日志条目数量
            if (logContainer.children.length > 10) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // 更新雷达点位置
        function updateRadarDot(distance) {
            const radarDot = document.getElementById('radarDot');
            const maxDistance = 300; // 最大探测距离 (cm)
            const radarRadius = 90; // 雷达显示半径 (px)
            
            const normalizedDistance = Math.min(distance / maxDistance, 1);
            const dotRadius = normalizedDistance * radarRadius;
            
            // 随机角度模拟扫描
            const angle = (Date.now() / 1000) % (2 * Math.PI);
            const x = Math.cos(angle) * dotRadius;
            const y = Math.sin(angle) * dotRadius;
            
            radarDot.style.transform = `translate(${x}px, ${y}px)`;
        }

        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            // 确保在用户交互后初始化音频
            document.addEventListener('click', function initAudioOnFirstClick() {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                document.removeEventListener('click', initAudioOnFirstClick);
            });
        });
    </script>
</body>
</html>
